[platformio]
default_envs = tdisplay-s3-touch, tdisplay-s3, waveshare-s3-touch-1_69, waveshare-s3-touch-1_83, waveshare-s3-touch-1_54, waveshare-s3-touch-1_47, waveshare-s3-amoled-1_64, tdisplay-s3-amoled-touch

[env]
platform = espressif32
framework = arduino
board_build.partitions = huge_app.csv
lib_ldf_mode = deep
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DUSER_SETUP_LOADED=1
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

[tdisplay_s3_base]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DTFT_RGB_ORDER=1
    -DINIT_SEQUENCE_3=1
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=1

[env:tdisplay-s3-touch]
extends = tdisplay_s3_base
build_flags =
    ${tdisplay_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3_TOUCH=1
    -Wno-attributes
lib_deps =
    ${env.lib_deps}
    fbiego/CST816S@^1.1.1

[env:tdisplay-s3]
extends = tdisplay_s3_base
build_flags =
    ${tdisplay_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3=1

[compact_s3_base]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=1
    -DTFT_MISO=-1
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000

[gfx_s3_base]
extends = compact_s3_base
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.6.9
build_flags =
    ${compact_s3_base.build_flags}
    -DCONFIG_SPIRAM_SUPPORT=1
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1

[env:waveshare-s3-touch-1_69]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_169=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=280
    -DTFT_BL=15

[env:waveshare-s3-touch-1_83]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_183=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=284
    -DTFT_BL=40

[env:waveshare-s3-touch-1_54]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_154=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_BL=46

[env:waveshare-s3-touch-1_47]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_147=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    -DTFT_BL=46

[env:waveshare-s3-amoled-1_64]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_AMOLED_164=1
    -DTFT_WIDTH=280
    -DTFT_HEIGHT=456
    -DTFT_BL=-1

[env:tdisplay-s3-amoled-touch]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3_AMOLED_TOUCH=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=536
    -DTFT_BL=-1
