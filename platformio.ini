; =====================================================================
;  PassVault — multi-placa
;  Compile uma placa:   pio run -e tdisplay-s3-touch
;  Compile todas:       pio run
; =====================================================================

[platformio]
default_envs = tdisplay-s3-touch, tdisplay-s3, waveshare-s3-touch-1_69, waveshare-s3-touch-1_83, waveshare-s3-touch-1_54, waveshare-s3-touch-1_47, waveshare-s3-amoled-1_64, tdisplay-s3-amoled-touch

; ---- Base comum a todas as placas ----
[env]
platform = espressif32
framework = arduino
board_build.partitions = huge_app.csv
; Core 3.x: o LDF padrao nao propaga dependencias internas (USB -> FS, WiFi -> Network)
lib_ldf_mode = deep
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DUSER_SETUP_LOADED=1
    ; silencia os #warning informativos do TFT_eSPI (DMA, TOUCH_CS etc.)
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ---- Familia T-Display S3 (ESP32-S3, ST7789 paralelo 8 bits, USB HID) ----
[tdisplay_s3_base]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; a placa define USB_MODE=1 (CDC/JTAG); USB HID (TinyUSB/OTG) precisa de 0
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    ; T-Display S3 usa RGB; com CGRAM_OFFSET o padrao do driver seria BGR
    -DTFT_RGB_ORDER=1
    -DINIT_SEQUENCE_3=1
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=1

; LilyGO T-Display S3 Touch — CST816S (I2C) com gestos
[env:tdisplay-s3-touch]
extends = tdisplay_s3_base
build_flags =
    ${tdisplay_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3_TOUCH=1
    ; a lib CST816S declara IRAM_ATTR em conflito (aviso interno da lib)
    -Wno-attributes
lib_deps =
    ${env.lib_deps}
    fbiego/CST816S@^1.1.1

; LilyGO T-Display S3 original — sem touch, 2 botoes (GPIO0 / GPIO14)
[env:tdisplay-s3]
extends = tdisplay_s3_base
build_flags =
    ${tdisplay_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3=1

; ---- Waveshare compact touch boards: native USB, ST7789 over SPI ----
; Pin references: manufacturer examples linked in README.md.
[waveshare_s3_touch_base]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_RGB_ORDER=1
    -DTFT_INVERSION_ON=1
    -DTFT_MOSI=7
    -DTFT_MISO=-1
    -DTFT_SCLK=6
    -DTFT_CS=5
    -DTFT_DC=4
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000

[env:waveshare-s3-touch-1_69]
extends = waveshare_s3_touch_base
build_flags =
    ${waveshare_s3_touch_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_169=1
    -DTFT_HEIGHT=280
    -DCGRAM_OFFSET=1
    -DTFT_RST=8
    -DTFT_BL=15

[env:waveshare-s3-touch-1_83]
extends = waveshare_s3_touch_base
build_flags =
    ${waveshare_s3_touch_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_183=1
    -DTFT_HEIGHT=284
    -DTFT_RST=38
    -DTFT_BL=40

; Native USB compact boards. TFT_eSPI remains the font/sprite renderer on QSPI.
[compact_s3_base]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER=1
    -DTFT_RGB_ORDER=1
    -DTFT_MISO=-1
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=40000000

[env:waveshare-s3-touch-1_54]
extends = compact_s3_base
build_flags =
    ${compact_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_154=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=39
    -DTFT_SCLK=38
    -DTFT_CS=21
    -DTFT_DC=45
    -DTFT_RST=40
    -DTFT_BL=46
    -DTFT_INVERSION_ON=1

[gfx_s3_base]
extends = compact_s3_base
lib_deps =
    ${env.lib_deps}
    moononournation/GFX Library for Arduino@1.6.9
build_flags =
    ${compact_s3_base.build_flags}
    ; TFT_eSPI 2.5.x uses this legacy guard for PSRAM allocation on core 3.x.
    -DCONFIG_SPIRAM_SUPPORT=1
    ; Dummy TFT_eSPI host: hardware is initialized exclusively by Arduino_GFX.
    -DTFT_CS=-1
    -DTFT_DC=-1
    -DTFT_RST=-1
    -DTFT_MOSI=-1
    -DTFT_SCLK=-1

[env:waveshare-s3-touch-1_47]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_TOUCH_147=1
    -DTFT_WIDTH=172
    -DTFT_HEIGHT=320
    -DTFT_BL=46

; V1.1 only: CS=46 (the original V1 uses CS=9).
[env:waveshare-s3-amoled-1_64]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_WAVESHARE_S3_AMOLED_164=1
    -DTFT_WIDTH=280
    -DTFT_HEIGHT=456
    -DTFT_BL=-1

; 1.91-inch QSPI Touch version, not AMOLED Plus (SPI).
[env:tdisplay-s3-amoled-touch]
extends = gfx_s3_base
build_flags =
    ${gfx_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3_AMOLED_TOUCH=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=536
    -DTFT_BL=-1
