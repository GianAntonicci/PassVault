; =====================================================================
;  PassVault — multi-placa
;  Compile uma placa:   pio run -e tdisplay-s3-touch
;  Compile todas:       pio run
; =====================================================================

[platformio]
default_envs = tdisplay-s3-touch, tdisplay-s3, cyd-2432s028, generic-ili9341

; ---- Base comum a todas as placas ----
[env]
platform = espressif32
framework = arduino
board_build.partitions = huge_app.csv
; Core 3.x: o LDF padrao nao propaga dependencias internas (USB -> FS, WiFi -> Network)
lib_ldf_mode = deep
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DUSER_SETUP_LOADED=1
    ; silencia os #warning informativos do TFT_eSPI (DMA, TOUCH_CS etc.)
    -DDISABLE_ALL_LIBRARY_WARNINGS=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; ---- Familia T-Display S3 (ESP32-S3, ST7789 paralelo 8 bits, USB HID) ----
[tdisplay_s3_base]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
; a placa define USB_MODE=1 (CDC/JTAG); USB HID (TinyUSB/OTG) precisa de 0
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DCGRAM_OFFSET=1
    -DINIT_SEQUENCE_3=1
    -DTFT_INVERSION_ON=1
    -DTFT_PARALLEL_8_BIT=1
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BL=38
    -DTFT_BACKLIGHT_ON=1

; ---- Familia ESP32 classico + ILI9341 SPI (BLE Keyboard) ----
[ili9341_ble_base]
board = esp32dev
; aplica o fix do core 3.x (String vs std::string) na lib BLE Keyboard
extra_scripts = pre:scripts/patch_blekeyboard.py
build_flags =
    ${env.build_flags}
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_BACKLIGHT_ON=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
lib_deps =
    ${env.lib_deps}
    t-vk/ESP32 BLE Keyboard@^0.3.2
; o LDF "deep" ignora #if e puxaria a lib USB (so existe no S3)
lib_ignore = USB

; =====================================================================

; LilyGO T-Display S3 Touch — CST816S (I2C) com gestos
[env:tdisplay-s3-touch]
extends = tdisplay_s3_base
build_flags =
    ${tdisplay_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3_TOUCH=1
    ; a lib CST816S declara IRAM_ATTR em conflito (aviso interno da lib)
    -Wno-attributes
lib_deps =
    ${env.lib_deps}
    fbiego/CST816S@^1.1.1

; LilyGO T-Display S3 original — sem touch, 2 botoes (GPIO0 / GPIO14)
[env:tdisplay-s3]
extends = tdisplay_s3_base
build_flags =
    ${tdisplay_s3_base.build_flags}
    -DBOARD_TDISPLAY_S3=1

; CYD ESP32-2432S028 — ILI9341 landscape, XPT2046 em barramento SPI proprio
[env:cyd-2432s028]
extends = ili9341_ble_base
build_flags =
    ${ili9341_ble_base.build_flags}
    -DBOARD_CYD=1
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTOUCH_CS=33
lib_deps =
    ${ili9341_ble_base.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4

; ESP32 generico + ILI9341 + XPT2046 no mesmo barramento SPI (VSPI)
[env:generic-ili9341]
extends = ili9341_ble_base
build_flags =
    ${ili9341_ble_base.build_flags}
    -DBOARD_GENERIC_ILI9341=1
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=17
    -DTFT_BL=4
    -DTOUCH_CS=27
